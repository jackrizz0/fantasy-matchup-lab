# Copy to .streamlit/secrets.toml (never commit that file) or paste into your host's "Secrets" settings.

# Optional — only needed for the Yahoo import. Register one app at https://developer.yahoo.com/apps/create
# with "Fantasy Sports: Read" permission.
[yahoo]
client_id = "your-yahoo-client-id"
client_secret = "your-yahoo-client-secret"
# On a hosted site, set the app's Redirect URI (in Yahoo's settings too) to the site's address:
# redirect_uri = "https://your-app.streamlit.app"
# Leave redirect_uri out when running on your own computer; Yahoo then shows a code to paste in.
